<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${location.name}">Полигон</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title" th:text="${location.name}">Название полигона</h2>
        <div class="entity-form">
            <p><strong>ID:</strong> <span th:text="${location.id}"></span></p>
            <p><strong>Название:</strong> <span th:text="${location.name}"></span></p>
            <p><strong>Адрес:</strong> <span th:text="${location.address}"></span></p>
            <p><strong>Площадь:</strong> <span th:text="${location.areaHectares}"></span> га</p>
            <p><strong>Описание:</strong> <span th:text="${location.description}"></span></p>
            <p><strong>Ответственный:</strong> <span th:text="${location.owner.nickname}"></span></p>
            <a href="/locations" class="btn btn-outline-small">← Назад к списку</a>
        </div>
    </div>
</section>
</body>
</html>
