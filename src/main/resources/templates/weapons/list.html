<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Оружие — Strikeball Arena</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="container header-container">
        <a href="/" class="logo">
            <span class="logo-icon">🎯</span>
            <span class="logo-text">Strikeball Arena</span>
        </a>
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Главная</a></li>
                <li><a href="/games" class="nav-link">Игры</a></li>
                <li><a href="/teams" class="nav-link">Команды</a></li>
                <li><a href="/locations" class="nav-link">Полигоны</a></li>
                <li><a href="/weapons" class="nav-link active">Оружие</a></li>
                <li><a href="/users" class="nav-link">Игроки</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Оружие</h2>
            <a href="/weapons/new" class="btn btn-primary">Добавить оружие</a>
        </div>

        <form action="/weapons" method="get" class="search-form">
            <input type="text" name="search" placeholder="Поиск по названию..."
                   th:value="${search}" class="search-input">
            <button type="submit" class="btn btn-primary">Найти</button>
            <a href="/weapons" class="btn btn-outline-small">Сбросить</a>
        </form>

        <div class="games-grid">
            <div class="game-card" th:each="weapon : ${weapons}">
                <h3 class="game-title" th:text="${weapon.name}">Название</h3>
                <p>Тип: <span th:text="${weapon.type.name}"></span></p>
                <p>Калибр: <span th:text="${weapon.caliber}"></span></p>
                <p>Цена: <span th:text="${weapon.price}"></span> ₽</p>
                <a th:href="@{/weapons/{id}(id=${weapon.id})}" class="btn btn-primary btn-block">Подробнее</a>
                <form th:action="@{/weapons/{id}/delete(id=${weapon.id})}" method="post" style="margin-top:8px">
                    <button type="submit" class="btn btn-outline-small"
                            onclick="return confirm('Удалить оружие?')">Удалить</button>
                </form>
            </div>
        </div>
        <p th:if="${weapons.isEmpty()}" class="empty-state">Оружие не найдено</p>
    </div>
</section>
</body>
</html>
