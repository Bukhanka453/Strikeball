<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Команды — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Управление командами</h2>
        <a href="/admin" class="btn btn-outline-small">← Назад в панель</a>
        <a href="/admin/teams/new" class="btn btn-primary" style="margin-left:10px">Добавить команду</a>

        <div class="games-grid" style="margin-top:20px">
            <div class="game-card" th:each="team : ${teams}">
                <h3 class="game-title" th:text="${team.name}">Название</h3>
                <p>Девиз: <span th:text="${team.motto}"></span></p>
                <p>Состав: <span th:text="${team.membersCount}"></span></p>
                <p>Капитан: <span th:text="${team.captain.nickname}"></span></p>
                <a th:href="@{/admin/teams/{id}/edit(id=${team.id})}"
                   class="btn btn-primary btn-block">Редактировать</a>
                <form th:action="@{/admin/teams/{id}/delete(id=${team.id})}"
                      method="post" style="margin-top:8px">
                    <button type="submit" class="btn btn-outline-small"
                            onclick="return confirm('Удалить команду?')">Удалить</button>
                </form>
            </div>
        </div>
        <p th:if="${teams.isEmpty()}" class="empty-state">Команд пока нет</p>
    </div>
</section>
</body>
</html>
