<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Полигоны — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Управление полигонами</h2>
        <a href="/admin" class="btn btn-outline-small">← Назад в панель</a>
        <a href="/admin/locations/new" class="btn btn-primary" style="margin-left:10px">Добавить полигон</a>

        <div class="games-grid" style="margin-top:20px">
            <div class="game-card" th:each="location : ${locations}">
                <h3 class="game-title" th:text="${location.name}">Название</h3>
                <p>Адрес: <span th:text="${location.address}"></span></p>
                <p>Площадь: <span th:text="${location.areaHectares}"></span> га</p>
                <p>Ответственный: <span th:text="${location.owner.nickname}"></span></p>
                <a th:href="@{/admin/locations/{id}/edit(id=${location.id})}"
                   class="btn btn-primary btn-block">Редактировать</a>
                <form th:action="@{/admin/locations/{id}/delete(id=${location.id})}"
                      method="post" style="margin-top:8px">
                    <button type="submit" class="btn btn-outline-small"
                            onclick="return confirm('Удалить полигон?')">Удалить</button>
                </form>
            </div>
        </div>
        <p th:if="${locations.isEmpty()}" class="empty-state">Полигонов пока нет</p>
    </div>
</section>
</body>
</html>
