<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Тип оружия — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Тип оружия</h2>

        <form th:action="@{/admin/weapon-types}" th:object="${weaponType}" method="post" class="entity-form">
            <div class="form-group">
                <label>Название типа:</label>
                <input type="text" th:field="*{name}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="form-group">
                <label>Описание:</label>
                <textarea th:field="*{description}" class="form-input" rows="3"></textarea>
                <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/admin/weapon-types" class="btn btn-outline-small">Отмена</a>
        </form>
    </div>
</section>
</body>
</html>
