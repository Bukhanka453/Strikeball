<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игры — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Управление играми</h2>
        <a href="/admin" class="btn btn-outline-small">← Назад в панель</a>
        <a href="/admin/games/new" class="btn btn-primary" style="margin-left:10px">Добавить игру</a>

        <div class="games-grid" style="margin-top:20px">
            <div class="game-card" th:each="game : ${games}">
                <h3 class="game-title" th:text="${game.name}">Название</h3>
                <p>Дата: <span th:text="${game.date}"></span></p>
                <p>Полигон: <span th:text="${game.location.name}"></span></p>
                <p>Организатор: <span th:text="${game.team.name}"></span></p>
                <p>Игроков: <span th:text="${game.currentPlayers} + ' / ' + ${game.maxPlayers}"></span></p>
                <a th:href="@{/admin/games/{id}/edit(id=${game.id})}"
                   class="btn btn-primary btn-block">Редактировать</a>
                <form th:action="@{/admin/games/{id}/delete(id=${game.id})}"
                      method="post" style="margin-top:8px">
                    <button type="submit" class="btn btn-outline-small"
                            onclick="return confirm('Удалить игру?')">Удалить</button>
                </form>
            </div>
        </div>
        <p th:if="${games.isEmpty()}" class="empty-state">Игр пока нет</p>
    </div>
</section>
</body>
</html>
