<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игра — Админ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Игра</h2>

        <form th:action="@{/admin/games}" th:object="${game}" method="post" class="entity-form">
            <div class="form-group">
                <label>Название:</label>
                <input type="text" th:field="*{name}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>
            <div class="form-group">
                <label>Дата:</label>
                <input type="date" th:field="*{date}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('date')}" th:errors="*{date}"></span>
            </div>
            <div class="form-group">
                <label>Макс. игроков:</label>
                <input type="number" th:field="*{maxPlayers}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('maxPlayers')}" th:errors="*{maxPlayers}"></span>
            </div>
            <div class="form-group">
                <label>Текущее число игроков:</label>
                <input type="number" th:field="*{currentPlayers}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('currentPlayers')}" th:errors="*{currentPlayers}"></span>
            </div>
            <div class="form-group">
                <label>Полигон:</label>
                <select th:field="*{location}" class="form-input">
                    <option value="">-- Выберите полигон --</option>
                    <option th:each="loc : ${locations}" th:value="${loc.id}" th:text="${loc.name}"></option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('location')}" th:errors="*{location}"></span>
            </div>
            <div class="form-group">
                <label>Команда-организатор:</label>
                <select th:field="*{team}" class="form-input">
                    <option value="">-- Выберите команду --</option>
                    <option th:each="t : ${teams}" th:value="${t.id}" th:text="${t.name}"></option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('team')}" th:errors="*{team}"></span>
            </div>
            <div class="form-group">
                <label>Описание:</label>
                <textarea th:field="*{description}" class="form-input" rows="4"></textarea>
                <span class="error" th:if="${#fields.hasErrors('description')}" th:errors="*{description}"></span>
            </div>
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/admin/games" class="btn btn-outline-small">Отмена</a>
        </form>
    </div>
</section>
</body>
</html>
