<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Команда — Strikeball Arena</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Команда</h2>

        <form th:action="@{/teams}" th:object="${team}" method="post" class="entity-form">

            <div class="form-group">
                <label>Название команды:</label>
                <input type="text" th:field="*{name}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
            </div>

            <div class="form-group">
                <label>Девиз:</label>
                <input type="text" th:field="*{motto}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('motto')}" th:errors="*{motto}"></span>
            </div>

            <div class="form-group">
                <label>Количество участников:</label>
                <input type="number" th:field="*{membersCount}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('membersCount')}" th:errors="*{membersCount}"></span>
            </div>

            <!-- Выбор капитана по никнейму -->
            <div class="form-group">
                <label>Капитан команды:</label>
                <select th:field="*{captain}" class="form-input">
                    <option value="">-- Выберите капитана --</option>
                    <option th:each="u : ${users}"
                            th:value="${u.id}"
                            th:text="${u.nickname}">
                    </option>
                </select>
                <span class="error" th:if="${#fields.hasErrors('captain')}" th:errors="*{captain}"></span>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/teams" class="btn btn-outline-small">Отмена</a>
        </form>
    </div>
</section>
</body>
</html>
