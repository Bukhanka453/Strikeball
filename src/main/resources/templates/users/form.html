<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игрок — Strikeball Arena</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Игрок</h2>

        <form th:action="@{/users}" th:object="${user}" method="post" class="entity-form">

            <div class="form-group">
                <label>Никнейм:</label>
                <input type="text" th:field="*{nickname}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></span>
            </div>

            <div class="form-group">
                <label>Email:</label>
                <input type="email" th:field="*{email}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>

            <div class="form-group">
                <label>Пароль:</label>
                <input type="password" th:field="*{password}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="form-group">
                <label>Возраст:</label>
                <input type="number" th:field="*{age}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
            </div>

            <div class="form-group">
                <label>Телефон:</label>
                <input type="text" th:field="*{phone}" class="form-input">
                <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
            </div>

            <button type="submit" class="btn btn-primary">Сохранить</button>
            <a href="/users" class="btn btn-outline-small">Отмена</a>
        </form>
    </div>
</section>
</body>
</html>
