<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Игроки — Strikeball Arena</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="container header-container">
        <a href="/" class="logo">
            <span class="logo-text">Strikeball Arena</span>
        </a>
        <nav class="nav">
            <ul class="nav-list">
                <li><a href="/" class="nav-link">Главная</a></li>
                <li><a href="/games" class="nav-link">Игры</a></li>
                <li><a href="/teams" class="nav-link">Команды</a></li>
                <li><a href="/locations" class="nav-link">Полигоны</a></li>
                <li><a href="/weapons" class="nav-link">Оружие</a></li>
                <li><a href="/users" class="nav-link active">Игроки</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="section">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Игроки</h2>
            <a href="/users/new" class="btn btn-primary">Добавить игрока</a>
        </div>

        <form action="/users" method="get" class="search-form">
            <input type="text" name="search" placeholder="Поиск по никнейму..."
                   th:value="${search}" class="search-input">
            <button type="submit" class="btn btn-primary">Найти</button>
            <a href="/users" class="btn btn-outline-small">Сбросить</a>
        </form>

        <div class="games-grid">
            <div class="game-card" th:each="user : ${users}">
                <h3 class="game-title" th:text="${user.nickname}">Никнейм</h3>
                <p>Email: <span th:text="${user.email}"></span></p>
                <p>Возраст: <span th:text="${user.age}"></span></p>
                <p>Телефон: <span th:text="${user.phone}"></span></p>
                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-primary btn-block">Подробнее</a>
                <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post" style="margin-top:8px">
                    <button type="submit" class="btn btn-outline-small"
                            onclick="return confirm('Удалить игрока?')">Удалить</button>
                </form>
            </div>
        </div>
        <p th:if="${users.isEmpty()}" class="empty-state">Игроки не найдены</p>
    </div>
</section>
</body>
</html>
