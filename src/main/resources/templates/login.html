<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Вход — Strikeball Arena</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="section">
    <div class="container">
        <h2 class="section-title">Вход</h2>

        <div class="entity-form">
            <div class="error" th:if="${param.error}">Неверный никнейм/email или пароль</div>
            <div class="error" th:if="${param.logout}">Вы вышли из системы</div>
            <div class="error" th:if="${param.registered}">Регистрация прошла успешно. Войдите.</div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Никнейм или Email:</label>
                    <input type="text" name="username" class="form-input" required>
                </div>
                <div class="form-group">
                    <label>Пароль:</label>
                    <input type="password" name="password" class="form-input" required>
                </div>
                <button type="submit" class="btn btn-primary">Войти</button>
                <a href="/register" class="btn btn-outline-small">Регистрация</a>
            </form>
        </div>
    </div>
</section>
</body>
</html>
